# Adjunta el paquete instalable (wheel y sdist) a cada release publicado (FR-046) y lo publica en
# PyPI (FR-048). Con eso sinsim se instala con: uv tool install sinsim
#
# También se lanza a mano para una etiqueta que ya existe (Actions › Run workflow): construye el
# código de esa etiqueta con esta versión de la acción. Sirve para reintentar un release.
#
# Cada acción está fijada a un commit exacto (la etiqueta va en el comentario). La construcción
# corre con permisos de solo lectura; solo el trabajo que sube los archivos puede escribir.
# PyPI usa Trusted Publishing: confía en este workflow y en el entorno `pypi`, sin tokens guardados.
name: Paquete del release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: Etiqueta de un release publicado (por ejemplo v0.5.0)
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.etiqueta }}

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: La versión del paquete coincide con la etiqueta
        run: |
          version="v$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)"
          if [ "$version" != "$TAG" ]; then
            echo "backend/pyproject.toml dice $version y la etiqueta es $TAG"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # pnpm 11 exige Node 22.13 o superior
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Construir la interfaz y el paquete
        run: make package

      - name: Comprobar que el wheel trae interfaz y snapshot de demostración
        run: |
          wheel=$(ls backend/dist/*.whl)
          unzip -l "$wheel" | grep -q "sinsim/web/index.html"
          unzip -l "$wheel" | grep -q "sinsim/_bundled/paratec/.*/manifest.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paquete
          path: |
            backend/dist/*.whl
            backend/dist/*.tar.gz
          if-no-files-found: error

  adjuntar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquete
          path: dist

      - name: Adjuntar al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  publicar-pypi:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sinsim/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquete
          path: dist

      # skip-existing: al relanzar para una etiqueta ya publicada, PyPI no admite reemplazar la versión.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
