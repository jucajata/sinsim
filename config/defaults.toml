"CQR" = "409df8ab-1083-49d9-13eb-08dd52a72d2b"
"Cauca-Narino" = "1b46b9c7-13a3-42d7-13e8-08dd52a72d2b"
"Cerromatoso" = "5e6ba023-0a8d-43d9-13e9-08dd52a72d2b"
